<!DOCTYPE html>

<div class="slide" style="background:var(--surface-dark);position:relative;overflow:hidden">

<x-import component-from-global-scope="CentralDePasajesDesignSystem_152b2f.Icon" name="MapPin" size="{{ 32 }}" color="#fff" hint-size="32px,32px"></x-import>
<div style="font-family:'Urbanist',sans-serif;font-weight:600;font-size:var(--text-metric-medium-size);line-height:var(--text-metric-medium-lh);color:#fff;margin-top:8px">0000</div>
<div style="font-family:'Inter',sans-serif;font-weight:600;font-size:24px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-on-dark-secondary)">Puntos de venta</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<x-import component-from-global-scope="CentralDePasajesDesignSystem_152b2f.Icon" name="FileText" size="{{ 32 }}" color="#fff" hint-size="32px,32px"></x-import>

<div class="span-6" style="display:flex;flex-direction:column;gap:16px;align-self:start;background:rgba(25,2,28,.82);border-radius:16px;padding:24px">

<tr><th style="text-align:left;padding:10px 20px;background:rgba(255,255,255,.08);color:#fff;font-size:24px;font-weight:600">Región</th><th style="text-align:right;padding:10px 20px;background:rgba(255,255,255,.08);color:#fff;font-size:24px;font-weight:600">Puntos de venta</th></tr>
<sc-for list="{{ regionRows }}" as="row" hint-placeholder-count="12">
<sc-if value="{{ row.isNew }}" hint-placeholder-val="{{ false }}">
<tr style="background:rgba(27,206,200,.12)">
<td style="padding:8px 20px;font-size:24px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:10px"><span style="width:8px;height:8px;border-radius:999px;background:var(--turquoise-500);flex-shrink:0"></span>{{ row.region }}</td>
<td style="padding:8px 20px;font-size:24px;font-weight:600;color:var(--turquoise-400);text-align:right">{{ row.value }}</td>
</tr>
</sc-if>
<sc-if value="{{ row.isEven }}">
<tr style="background:transparent">
<td style="padding:8px 20px;font-size:24px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:10px">{{ row.region }}</td>
<td style="padding:8px 20px;font-size:24px;font-weight:600;color:#fff;text-align:right">{{ row.value }}</td>
</tr>
</sc-if>
<sc-if value="{{ row.isOdd }}">
<tr style="background:rgba(255,255,255,.04)">
<td style="padding:8px 20px;font-size:24px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:10px">{{ row.region }}</td>
<td style="padding:8px 20px;font-size:24px;font-weight:600;color:#fff;text-align:right">{{ row.value }}</td>
</tr>
</sc-if>
</sc-for>
</table>
</div>
</div>
</div>
<div class="slide-footer" style="position:relative">
<img src="../../assets/logos/cdp-wordmark-blanco.png" alt="Central de Pasajes" style="height:22px;display:block">
<span class="page-number" style="color:#fff">09</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const regionRows = [
      ['Capital Federal', '162'], ['Región Pampeana', '100'], ['Gran Buenos Aires Sur', '43'],
      ['Región Noroeste', '41'], ['Gran Buenos Aires Norte', '40'], ['Gran Buenos Aires Oeste', '30'],
      ['Región Cuyo', '17'], ['Región Patagonia', '15'], ['Región Mesopotamia', '14'],
      ['Uruguay', '3'], ['Bolivia', '1']
    ].map(([region, value], i) => ({ region, value, isEven: i % 2 === 0, isOdd: i % 2 !== 0, isNew: false }));

    return { regionRows };
  }
}
</script>
