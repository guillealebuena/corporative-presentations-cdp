<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><script src="./image-slot.js"></script></helmet>
<div class="slide" style="background:#fff;position:relative" data-screen-label="Selección de asiento">
<div class="slide-frame">
<div class="slide-header">
<div style="display:flex;align-items:center;gap:12px">
<span style="width:24px;height:3px;background:var(--turquoise-500);flex-shrink:0"></span>
<span style="font-family:'Inter',sans-serif;font-weight:600;font-size:24px;line-height:30px;letter-spacing:1.6px;text-transform:uppercase;color:var(--brand-primary)">Paso 3 de 6</span>
</div>
<div style="font-family:'Urbanist',sans-serif;font-weight:600;font-size:72px;line-height:84px;color:var(--text-title)">Selección de asiento</div>
</div>
<div class="slide-body" style="grid-template-rows:none">
<div class="span-12" style="display:flex;flex-direction:column;align-items:center;gap:24px">
<div style="display:flex;gap:60px;align-items:flex-start;justify-content:center">
<div style="display:flex;flex-direction:column;gap:12px;width:1300px;align-items:center">
<div style="width:1300px;height:588px;border-radius:12px;border:1.5px solid var(--brand-primary);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.07);background:#fff">
<image-slot id="s6-neo-desktop" shape="rect" fit="cover" placeholder="Selección de asiento — Desktop Ray Bus" src="../../assets/carrito-web/s6-neo-desktop.png" style="width:100%;height:100%"></image-slot>
</div>
<div style="display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:var(--surface-soft)">
<x-import component-from-global-scope="CentralDePasajesDesignSystem_152b2f.Icon" name="Desktop" size="{{ 22 }}" color="var(--text-muted)" hint-size="22px,22px"></x-import>
<span style="font-family:'Inter',sans-serif;font-size:24px;color:var(--text-muted)">Desktop</span>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:12px;width:290px;align-items:center">
<div style="width:290px;height:615px;border-radius:26px;border:6px solid var(--brand-primary);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.07);background:#000">
<image-slot id="s6-neo-mobile" shape="rect" fit="cover" src="../../assets/carrito-web/s6-neo-mobile.png" placeholder="Selección de asiento — Mobile Ray Bus" style="width:100%;height:100%"></image-slot>
</div>
<div style="display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:var(--surface-soft)">
<x-import component-from-global-scope="CentralDePasajesDesignSystem_152b2f.Icon" name="DeviceMobile" size="{{ 22 }}" color="var(--text-muted)" hint-size="22px,22px"></x-import>
<span style="font-family:'Inter',sans-serif;font-size:24px;color:var(--text-muted)">Mobile</span>
</div>
</div>
</div>
</div>
</div>
</div>
</x-dc>
</body>
</html>
