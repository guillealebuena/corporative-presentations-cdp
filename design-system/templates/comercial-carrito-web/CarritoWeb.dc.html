<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Comercial · Carrito Web" description="Deck comercial de 9 slides — flujo de compra web (búsqueda, resultados, asiento, pago, cierre)" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;background:#000;font-family:'Inter',sans-serif">
<div style="width:1920px;height:1080px;transform:scale(0.6667);transform-origin:top left;position:absolute;left:0;top:0">
<sc-if value="{{ vis.s1 }}" hint-placeholder-val="{{ true }}"><dc-import name="Slide01" hint-size="1920px,1080px"></dc-import></sc-if>
<sc-if value="{{ vis.s2 }}"><dc-import name="Slide02" hint-size="1920px,1080px"></dc-import></sc-if>
<sc-if value="{{ vis.s3 }}"><dc-import name="Slide03" hint-size="1920px,1080px"></dc-import></sc-if>
<sc-if value="{{ vis.s4 }}"><dc-import name="Slide04" hint-size="1920px,1080px"></dc-import></sc-if>
<sc-if value="{{ vis.s5 }}"><dc-import name="Slide05" hint-size="1920px,1080px"></dc-import></sc-if>
<sc-if value="{{ vis.s6 }}"><dc-import name="Slide06" hint-size="1920px,1080px"></dc-import></sc-if>
<sc-if value="{{ vis.s7 }}"><dc-import name="Slide07" hint-size="1920px,1080px"></dc-import></sc-if>
<sc-if value="{{ vis.s8 }}"><dc-import name="Slide08" hint-size="1920px,1080px"></dc-import></sc-if>
<sc-if value="{{ vis.s9 }}"><dc-import name="Slide09" hint-size="1920px,1080px"></dc-import></sc-if>
</div>
<div onClick="{{ next }}" onContextMenu="{{ prev }}" style="position:absolute;left:0;right:0;top:0;bottom:0;cursor:pointer;z-index:10" title="Click: siguiente / clic derecho: anterior"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720}}">
class Component extends DCLogic {
  state = { n: 1 };
  renderVals() {
    const vis = {};
    for (let i = 1; i <= 9; i++) vis['s' + i] = i === this.state.n;
    return {
      vis,
      next: (e) => { e.preventDefault(); this.setState(s => ({ n: s.n < 9 ? s.n + 1 : 1 })); },
      prev: (e) => { e.preventDefault(); this.setState(s => ({ n: s.n > 1 ? s.n - 1 : 9 })); }
    };
  }
}
</script>
</body>
</html>
